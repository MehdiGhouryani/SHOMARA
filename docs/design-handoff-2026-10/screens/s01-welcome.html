<title>S01 · خوش‌آمد</title>

<style>
:root {
  --canvas: #F5F7F8; --surface: #FFFFFF; --on-surface: #1B2A36; --on-surface-variant: #4D5F6D;
  --outline: #6B7C88; --outline-variant: #E4EAEE;
  --tertiary: #E3A33B; --on-tertiary: #1B2A36; --tertiary-edge: #B07A2A;
  --violet: #7462E6; --violet-container: #E3DCFC;
  --font: Vazirmatn, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media all {
  :root[data-theme="dark"] {
    --canvas: #0F1A22; --surface: #17242E; --on-surface: #E6EDF2; --on-surface-variant: #B3C0CA;
    --outline: #8795A0; --outline-variant: #2A3A46;
    --tertiary: #E8B458; --on-tertiary: #2B1E00; --tertiary-edge: #B8862F;
    --violet: #B3A6FF; --violet-container: #2D2750;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--canvas); color: var(--on-surface); font-family: var(--font); }
body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 12px; }
.label { font-size: 14px; line-height: 20px; color: var(--on-surface-variant); }
.screen {
  width: 360px; max-width: 100%; height: 800px; background: var(--canvas);
  border: 1px solid var(--outline-variant); border-radius: 28px; overflow: hidden;
  padding: calc(40px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center;
}
.hero { width: 220px; height: 220px; margin-top: 24px; position: relative; display: flex; align-items: center; justify-content: center; }
.halo { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--violet); opacity: 0.9; }
.hero img { width: 200px; height: auto; position: relative; }
h1 { margin: 32px 0 8px; font-size: 32px; line-height: 40px; font-weight: 600; text-align: center; }
.sub { margin: 0; font-size: 18px; line-height: 28px; color: var(--on-surface-variant); text-align: center; }
.spacer { flex: 1; }
.btn {
  width: 100%; min-height: 56px; border: 0; border-radius: 20px; background: var(--tertiary); color: var(--on-tertiary);
  font-family: var(--font); font-size: 18px; font-weight: 600; box-shadow: 0 3px 0 var(--tertiary-edge); cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1);
}
.btn:active { transform: translateY(3px) scale(0.985); box-shadow: 0 0 0 var(--tertiary-edge); }
.btn:focus-visible { outline: 3px solid var(--outline); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
