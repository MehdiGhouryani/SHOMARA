<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><title>S12 · نتیجهٔ مرحله</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--page:#E9EEF1;--canvas:#F5F7F8;--ink:#1B2A36;--muted:#4D5F6D;--surface:#FFFFFF;--line:#DCE6EB;--primary:#2B5C7A;--pc:#D5E5EF;--on-pc:#163A4F;--t:#E3A33B;--on-t:#1B2A36;--t-edge:#B07A2A;--sv:#E9EEF1;--vc:#E3DCFC;--on-vc:#3A2C86;--violet:#7462E6;--c1:#E3A33B;--c2:#8DB9D6;--c3:#7462E6;--halo:#D5E5EF;--font:Vazirmatn,system-ui,"Segoe UI",sans-serif}
:root[data-theme="dark"]{--page:#0A1218;--canvas:#0F1A22;--ink:#E6EDF2;--muted:#B3C0CA;--surface:#17242E;--line:#2A3A46;--primary:#8DB9D6;--pc:#1D3A4E;--on-pc:#CFE5F2;--t:#E8B458;--on-t:#2B1E00;--t-edge:#B8862F;--sv:#213140;--vc:#2D2750;--on-vc:#E6E1FF;--violet:#B3A6FF;--halo:#1D3A4E}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font)}
body{padding:16px 12px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bar{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}.bar button{min-height:40px;min-width:84px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-family:var(--font);font-size:15px;cursor:pointer}.bar button[aria-pressed="true"]{background:var(--pc);color:var(--ink);font-weight:600}
.note{margin:0;font-size:14px;line-height:22px;color:var(--muted);text-align:center;max-width:760px}
.grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}.cell{margin:0;display:flex;flex-direction:column;gap:8px;align-items:center}figcaption{font-size:14px;color:var(--muted);text-align:center;max-width:360px}
.phone{position:relative;width:360px;max-width:100%;height:800px;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:var(--canvas);display:flex;flex-direction:column}
.conf{position:absolute;inset:0 0 auto 0;height:180px;pointer-events:none}.conf i{position:absolute;width:10px;height:22px;border-radius:4px;opacity:.85}
.body{flex:1;padding:36px 24px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.halo{width:240px;height:240px;border-radius:50%;background:var(--halo);display:grid;place-items:center}.halo img{width:210px;height:auto}
h1{margin:0;font-size:34px;line-height:44px;font-weight:600;text-align:center}.sub{margin:0;font-size:18px;line-height:28px;text-align:center;color:var(--muted)}
.prog{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:260px}.pbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%}.pbar i{height:10px;border-radius:999px;background:var(--sv)}.pbar i.on{background:var(--primary)}.prog span{font-size:14px;color:var(--muted)}
.ach,.unit{width:100%;display:flex;align-items:center;gap:12px;border-radius:20px;padding:12px 16px}.ach{background:var(--vc);color:var(--on-vc)}.unit{background:var(--pc);color:var(--on-pc)}
.medal{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:var(--violet);display:grid;place-items:center}.medal svg{width:28px;height:28px;fill:#fff}
.at{display:flex;flex-direction:column}.at small,.unit small{font-size:13px;opacity:.9;display:block}.at b,.unit b{font-size:18px}
.ui{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--surface);display:grid;place-items:center}.ui svg{width:22px;height:22px;fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.foot{padding:10px 20px 22px}.btn{width:100%;min-height:56px;border:0;border-radius:20px;background:var(--t);color:var(--on-t);font-family:var(--font);font-size:18px;font-weight:600;box-shadow:0 3px 0 var(--t-edge);cursor:pointer}.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style></head><body>
<div class="bar" role="group" aria-label="تم نمایش"><button type="button" data-t="light" aria-pressed="true">روشن</button><button type="button" data-t="dark" aria-pressed="false">تیره</button></div>
<p class="note">S12 · نتیجهٔ مرحله. فقط شخصیت راهنما در حالت جشن، یک جمله، پیشرفت فصل، و در صورت وجود دستاورد یا پایان فصل. بدون ستاره، امتیاز، جواهر و استریک. «ادامه» به مسیر برمی‌گردد (S07). ذرات جشن در کد با کاهش حرکت ثابت یا حذف می‌شوند.</p>
