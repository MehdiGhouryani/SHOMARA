<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><title>قالب‌های درس (UI اولیه هر مرحله)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet"><style>:root{--page:#E9EEF1;--canvas:#F5F7F8;--ink:#1B2A36;--muted:#4D5F6D;--surface:#FFFFFF;--line:#DCE6EB;--primary:#2B5C7A;--on-primary:#FFFFFF;--pc:#D5E5EF;--on-pc:#163A4F;--accent:#2B5C7A;--t:#E3A33B;--on-t:#1B2A36;--t-edge:#B07A2A;--nc:#EEE3CF;--on-nc:#3A3026;--nstroke:#8B7B63;--sv:#E9EEF1;--bead:#2B5C7A;--bead-edge:#1F4459;--font:Vazirmatn,system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme="dark"]{--page:#0A1218;--canvas:#0F1A22;--ink:#E6EDF2;--muted:#B3C0CA;--surface:#17242E;--line:#2A3A46;--primary:#8DB9D6;--on-primary:#0E2535;--pc:#1D3A4E;--on-pc:#CFE5F2;--accent:#8DB9D6;--t:#E8B458;--on-t:#2B1E00;--t-edge:#B8862F;--nc:#2E2A24;--on-nc:#EADFCB;--nstroke:#8B7B63;--sv:#213140;--bead:#8DB9D6;--bead-edge:#5D8FAE}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font)}
body{padding:16px 12px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bar{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.bar button{min-height:40px;min-width:84px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-family:var(--font);font-size:15px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--pc);color:var(--ink);font-weight:600}
.note{margin:0;font-size:14px;line-height:22px;color:var(--muted);text-align:center;max-width:760px}
.grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
.cell{margin:0;display:flex;flex-direction:column;gap:8px;align-items:center}
figcaption{font-size:14px;color:var(--muted);text-align:center;max-width:360px;min-height:40px}
.phone{position:relative;width:360px;max-width:100%;height:800px;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:var(--canvas);display:flex;flex-direction:column}
.top{padding:14px 16px 0}
.row{display:flex;align-items:center;gap:10px}
.close{width:44px;height:44px;flex:0 0 44px;border:0;background:none;color:var(--ink);border-radius:14px;display:grid;place-items:center;cursor:pointer}
.close svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.parts{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.parts i{display:block;height:10px;border-radius:999px;background:var(--sv)}
.parts i.done{background:var(--primary)}
.parts i.now{background:var(--t)}
.plabel{margin:6px 0 0;text-align:center;font-size:14px;line-height:20px;color:var(--muted)}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.body{flex:1;padding:12px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0}
.foot{padding:10px 20px 22px;display:flex;flex-direction:column;gap:10px}
.char{width:120px;height:auto;display:block}.char.sm{width:84px}
.card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.beads{display:flex;gap:10px;direction:ltr;flex-wrap:wrap;justify-content:center}
.bead{width:44px;height:44px;border-radius:50%;background:var(--bead);box-shadow:0 3px 0 var(--bead-edge);display:inline-block}
.beads.hint .bead{outline:3px solid var(--t);outline-offset:2px}
.nums{display:flex;gap:10px;direction:ltr;font-size:22px;font-weight:600}.nums span{width:44px;text-align:center}
.say{margin:0;font-size:22px;line-height:34px;font-weight:600;text-align:center}.say.sub{font-size:18px;line-height:28px;font-weight:400;color:var(--muted)}
.q{margin:0;font-size:24px;line-height:34px;font-weight:600;text-align:center}
.big{margin:0;font-size:28px;line-height:38px;font-weight:600;text-align:center}
.hear{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--primary);font-family:var(--font);font-size:16px;font-weight:600;cursor:pointer}
.hear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;direction:ltr}
.opt{position:relative;min-height:84px;border-radius:20px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--font);font-size:32px;font-weight:600;cursor:pointer}
.opt.sel{border:3px solid var(--primary);background:var(--pc);color:var(--on-pc)}
.opt.good{border:3px solid var(--primary);background:var(--pc);color:var(--on-pc)}
.opt.bad{border:2px solid var(--nstroke);background:var(--nc);color:var(--on-nc)}
.opt .mk{position:absolute;top:6px;right:6px;width:24px;height:24px;display:grid;place-items:center}
.opt .mk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn{width:100%;min-height:56px;border:0;border-radius:20px;background:var(--t);color:var(--on-t);font-family:var(--font);font-size:18px;font-weight:600;box-shadow:0 3px 0 var(--t-edge);cursor:pointer}
.btn:active{transform:translateY(3px) scale(.985);box-shadow:0 0 0 var(--t-edge)}
.btn:disabled{background:var(--sv);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.hear:focus-visible,.close:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.tbtn{min-height:48px;border:0;background:none;color:var(--primary);font-family:var(--font);font-size:16px;font-weight:600;cursor:pointer}
.fb{display:flex;align-items:center;gap:12px;border-radius:20px;padding:14px 16px}
.fb.good{background:var(--pc);color:var(--on-pc)}.fb.retry{background:var(--nc);color:var(--on-nc)}
.fbi{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:0 0 32px}
.fbi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fbt{font-size:18px;font-weight:600}
.game{width:100%;background:var(--surface);border:2px dashed var(--line);border-radius:24px;padding:12px;height:300px;display:flex;flex-direction:column}
.gtop{display:flex;justify-content:flex-start}.badge2{min-width:44px;height:44px;border-radius:22px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;font-size:22px;font-weight:600}
.field{flex:1;display:flex;flex-wrap:wrap;gap:22px;align-content:center;justify-content:center;direction:ltr}
.bead.t{opacity:.35}.bead.t.on{opacity:1}
.trophy{width:96px;height:96px;border-radius:50%;background:var(--pc);color:var(--primary);display:grid;place-items:center}
.trophy svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.trophy svg .tint{fill:currentColor;fill-opacity:.25}
.dlg{position:absolute;inset:0;background:rgba(10,18,24,.45);display:flex;align-items:center;padding:24px;z-index:20}
.dbox{width:100%;background:var(--surface);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px}
.dbox h2{margin:0;font-size:20px}.dbox p{margin:0 0 6px;font-size:16px;line-height:26px;color:var(--muted)}
.banner{background:var(--pc);color:var(--on-pc);border-radius:16px;padding:12px 16px;font-size:15px;line-height:24px}
.banner.warm{background:var(--nc);color:var(--on-nc)}
.skel{height:56px;border-radius:16px;background:var(--sv)}.skel.s2{width:70%}
</style></head><body>
<div class="bar" role="group" aria-label="تم نمایش"><button type="button" data-t="light" aria-pressed="true">روشن</button><button type="button" data-t="dark" aria-pressed="false">تیره</button></div>
<p class="note">UI اولیهٔ هر مرحله: پنج قالب ثابت (بخش‌های ۱ تا ۵)، بازیابی، خروج، و حالت «به‌زودی». محتوای نمونه (شمارش مهره) فقط برای نمایش است و بعداً از داده می‌آید. شخصیت فقط در بخش‌های ۱ و ۲ و بازیابی و S09 است.</p>
