<!doctype html>
<html lang="fa" dir="rtl">
<head>

<title>S10 · درس، بخش ۱: کشف می‌کنیم</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --canvas:#F5F7F8; --surface:#FFFFFF; --on-surface:#1B2A36; --on-surface-variant:#4D5F6D;
  --outline:#6B7C88; --outline-variant:#E4EAEE; --primary:#2B5C7A; --primary-edge:#1F4459;
  --primary-container:#D5E5EF; --on-primary-container:#163A4F; --surface-variant:#E9EEF1;
  --tertiary:#E3A33B; --on-tertiary:#1B2A36; --tertiary-edge:#B07A2A;
  --font: Vazirmatn, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; background:var(--canvas); color:var(--on-surface); font-family:var(--font); }
body { padding:20px 12px 40px; display:flex; flex-direction:column; align-items:center; gap:14px; }
.label { font-size:14px; color:var(--on-surface-variant); text-align:center; max-width:360px; }
.screen { width:360px; max-width:100%; height:800px; background:var(--canvas); border:1px solid var(--outline-variant); border-radius:28px; overflow:hidden;
  padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px; }
.top { display:flex; align-items:center; gap:12px; }
.close { width:44px; height:44px; flex:0 0 44px; border:0; background:none; color:var(--on-surface); border-radius:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.close svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; }
.parts { flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.parts i { display:block; height:10px; border-radius:999px; background:var(--surface-variant); }
.parts i.now { background:var(--tertiary); }
.parts i.done { background:var(--primary); }
.plabel { font-size:14px; line-height:20px; color:var(--on-surface-variant); text-align:center; }
.plabel b { color:var(--primary); font-weight:600; }
.stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
.picture { width:100%; background:var(--surface); border:1px solid var(--outline-variant); border-radius:24px; padding:20px 12px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.beads { display:flex; gap:10px; direction:ltr; }
.bead { width:44px; height:44px; border-radius:50%; background:var(--primary); box-shadow:0 3px 0 var(--primary-edge); }
.nums { display:flex; gap:10px; direction:ltr; font-size:22px; font-weight:600; color:var(--on-surface); }
.nums span { width:44px; text-align:center; }
.say { margin:0; font-size:22px; line-height:34px; font-weight:600; text-align:center; }
.hear { display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:0 16px; border-radius:999px; border:2px solid var(--outline-variant); background:var(--surface); color:var(--primary); font-family:var(--font); font-size:16px; font-weight:600; cursor:pointer; }
.hear svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.char { width:96px; height:auto; }
.spacer { flex:0; }
.btn { width:100%; min-height:56px; border:0; border-radius:20px; background:var(--tertiary); color:var(--on-tertiary); font-family:var(--font); font-size:18px; font-weight:600; box-shadow:0 3px 0 var(--tertiary-edge); cursor:pointer; }
.btn:active { transform:translateY(3px) scale(0.985); box-shadow:0 0 0 var(--tertiary-edge); }
.btn:focus-visible { outline:3px solid var(--outline); outline-offset:3px; }
.states { display:flex; flex-direction:column; gap:12px; width:360px; max-width:100%; }
.card { background:var(--surface); border:1px solid var(--outline-variant); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:12px; }
.cap { font-size:14px; line-height:20px; color:var(--on-surface-variant); margin:0; }
.banner { background:var(--surface-variant); border-radius:18px; padding:12px 16px; font-size:16px; line-height:24px; }
.banner.err { background:#F7E1DD; color:#5C1F17; }
@media all {
  :root[data-theme="dark"] {
    --canvas: #0F1A22;
    --surface: #17242E;
    --on-surface: #E6EDF2;
    --on-surface-variant: #B3C0CA;
    --outline: #8795A0;
    --outline-variant: #2A3A46;
    --primary: #8DB9D6;
    --on-primary: #0E2535;
    --primary-edge: #5D8FAE;
    --primary-container: #1D3A4E;
    --on-primary-container: #CFE5F2;
    --surface-variant: #213140;
    --tertiary: #E8B458;
    --on-tertiary: #2B1E00;
    --tertiary-edge: #B8862F;
    --error: #F2A093;
    --error-container: #3A221E;
    --on-error-container: #F8D3CC;
    --violet: #B3A6FF;
    --violet-container: #2D2750;
    --on-violet-container: #E6E1FF;
    --neutral: #B8A58C;
    --neutral-container: #2E2A24;
    --sv: #213140;
  }
}
</style>
