    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>
  </noscript>

<body>
  <div id="__bundler_placeholder">Loading راهنمای طراحی...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"fa\" dir=\"rtl\"><head>\n<meta charset=\"utf-8\">\n<title>راهنمای طراحی<\u002Ftitle>\n<script src=\"dc303e33-8bb9-4b1a-97d1-faa5566c448f\"><\u002Fscript>\n<style>:root{--canvas:#F5F7F8;--surface:#FFFFFF;--ink:#1B2A36;--ink2:#4D5F6D;--line:#E4EAEE;--line2:#D3DBE0;--outline:#6B7C88;--primary:#2B5C7A;--primary-edge:#1F4459;--primary-c:#D5E5EF;--on-primary-c:#163A4F;--surface-v:#E9EEF1;--amber:#E3A33B;--amber-edge:#B07A2A;--on-amber:#1B2A36;--neutral-c:#EEE3CF;--error:#A94438;--error-c:#F7E1DD;--violet:#7462E6;--violet-c:#E3DCFC;--on-violet-c:#2F2470;--font:Vazirmatn,system-ui,-apple-system,\"Segoe UI\",sans-serif}\n*,*::before,*::after{box-sizing:border-box}\nhtml,body{margin:0;background:var(--canvas)}\n.scr{position:relative;display:flex;flex-direction:column;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:18px;line-height:28px;overflow:hidden;direction:rtl;text-align:right}\n.scr button{font-family:var(--font);cursor:pointer}\n.scr svg{display:block;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}\n/* top bar: back/close at right, progress fills from right */\n.top{display:flex;align-items:center;gap:8px;height:64px;padding:8px 12px 8px 24px;flex:none}\n.ibtn{width:48px;height:48px;flex:none;border:0;border-radius:16px;background:transparent;color:var(--ink2);display:grid;place-items:center;padding:0}\n.ibtn svg{width:28px;height:28px}\n.bar{flex:1;height:16px;border-radius:99px;background:var(--surface-v);overflow:hidden}\n.bar>i{display:block;height:100%;border-radius:99px;background:var(--primary)}\n.body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 24px 0}\n.foot{flex:none;display:flex;flex-direction:column;gap:8px;padding:16px 24px 32px}\n/* type */\n.h1{margin:0;font-size:28px;line-height:40px;font-weight:600;text-align:center}\n.sub{margin:0;font-size:18px;line-height:28px;color:var(--ink2);text-align:center}\n.cap{font-size:14px;line-height:20px;color:var(--ink2)}\n.lab{font-size:16px;line-height:24px;font-weight:600;color:var(--ink)}\n.fill{flex:1}\n/* buttons */\n.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:20px;background:linear-gradient(#EBB04E,#E3A33B);color:var(--on-amber);font-size:18px;font-weight:600;box-shadow:0 6px 0 var(--amber-edge),inset 0 2px 0 rgba(255,255,255,.45);transition:transform .12s,box-shadow .12s}\n.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--amber-edge),inset 0 2px 0 rgba(255,255,255,.45)}\n.btn.pri{background:linear-gradient(#3A7191,#2B5C7A);color:#fff;box-shadow:0 6px 0 var(--primary-edge),inset 0 2px 0 rgba(255,255,255,.28)}\n.btn.pri:active:not(:disabled){box-shadow:0 1px 0 var(--primary-edge),inset 0 2px 0 rgba(255,255,255,.28)}\n.btn.sec{background:linear-gradient(#fff,#F6F9FA);color:var(--primary);border:2px solid var(--line2);box-shadow:0 5px 0 var(--line2),inset 0 2px 0 #fff}\n.btn.sec:active:not(:disabled){box-shadow:0 1px 0 var(--line2),inset 0 2px 0 #fff}\n.btn.off{background:var(--surface-v);color:var(--ink2);box-shadow:0 6px 0 var(--line2),inset 0 2px 0 rgba(255,255,255,.6);cursor:not-allowed}\n.btn svg{width:24px;height:24px}\n.tbtn{min-height:48px;border:0;background:none;color:var(--primary);font-size:16px;font-weight:600;padding:0 12px}\n/* characters: hero (free), portrait (circle) */\n.hero{display:block;object-fit:contain;flex:none}\n.por{width:88px;height:88px;flex:none;border-radius:50%;overflow:hidden;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);background:var(--surface-v);display:grid;place-items:end center}\n.por img{width:100%;height:100%;object-fit:contain;display:block}\n.por.cover img{object-fit:cover}\n.por.main{background:var(--violet-c)}.por.num{background:var(--primary-c)}.por.rok{background:var(--error-c)}\n.por.lg{width:120px;height:120px}\n.guide{display:flex;align-items:center;gap:16px;width:100%}\n.bub{position:relative;flex:1;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 16px;font-size:18px;line-height:28px;font-weight:600}\n.bub::before{content:\"\";position:absolute;right:-9px;top:50%;width:14px;height:14px;margin-top:-7px;background:var(--surface);border-top:2px solid var(--line);border-right:2px solid var(--line);transform:rotate(45deg)}\n/* cards, chips, inputs */\n.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--line)}\n.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:99px;background:var(--surface);border:2px solid var(--line);font-size:14px;line-height:20px;color:var(--ink2)}\n.chip svg{width:16px;height:16px}\n.chip.vio{background:var(--violet-c);border-color:var(--violet-c);color:var(--on-violet-c);font-weight:600}\n.field{display:flex;flex-direction:column;gap:8px;width:100%}\n.inp{display:flex;align-items:center;gap:8px;height:60px;border:2px solid var(--outline);border-radius:16px;background:var(--surface);padding:0 16px;font-size:20px;color:var(--ink)}\n.inp.on{border-color:var(--primary);border-width:3px}\n.inp .ph{color:var(--ink2)}\n.pre{height:44px;min-width:64px;padding:0 12px;border-radius:12px;background:var(--surface-v);display:grid;place-items:center;font-size:18px;font-weight:600;direction:ltr}\n.ltr{direction:ltr;unicode-bidi:isolate}\n/* beads */\n.tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:24px 16px;box-shadow:0 4px 0 var(--line)}\n.bead{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#5C8BA8 0,#2B5C7A 55%);box-shadow:0 5px 0 var(--primary-edge),inset 0 2px 0 rgba(255,255,255,.3)}\n.bn{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:24px;font-weight:600;line-height:32px}\n/* choices */\n.opts{display:flex;gap:12px;width:100%}\n.opt{flex:1;height:88px;border:2px solid var(--line2);border-radius:20px;background:linear-gradient(#fff,#F6F9FA);color:var(--ink);font-size:36px;font-weight:600;box-shadow:0 6px 0 var(--line2),inset 0 2px 0 #fff}\n.opt.sel{border-color:var(--primary);background:var(--primary-c);color:var(--primary-edge);box-shadow:0 6px 0 var(--primary),inset 0 2px 0 rgba(255,255,255,.6)}\n/* feedback sheet */\n.fb{flex:none;display:flex;flex-direction:column;gap:16px;padding:24px 24px 32px;border-radius:28px 28px 0 0;background:var(--primary-c);color:var(--on-primary-c)}\n.fb.soft{background:var(--neutral-c);color:#3A3026}\n.fbh{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600;line-height:28px}\n.fbi{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--primary)}\n.fb.soft .fbi{color:#7A5A22}\n.fbi svg{width:26px;height:26px}\n/* tab bar */\n.tabs{flex:none;display:flex;height:84px;background:var(--surface);border-top:2px solid var(--line);padding:8px 8px 12px}\n.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--ink2);font-size:14px;line-height:20px}\n.tab .ic{width:64px;height:36px;border-radius:18px;display:grid;place-items:center}\n.tab .ic svg{width:26px;height:26px}\n.tab.on{color:var(--primary);font-weight:600}\n.tab.on .ic{background:var(--primary-c)}\n/* path */\n.unit{flex:none;margin:12px 16px 0;padding:12px 20px;border-radius:22px;background:var(--primary);color:#fff;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 var(--primary-edge)}\n.unit .k{font-size:14px;line-height:20px;opacity:.9}\n.unit .t{font-size:22px;line-height:32px;font-weight:600}\n.pips{display:flex;gap:4px;align-items:center;font-size:14px;line-height:20px}\n.pips i{width:20px;height:6px;border-radius:99px;background:#fff;opacity:.35;display:block}.pips i.on{opacity:1}\n.trail{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:44px;background:linear-gradient(#E1EFF4,#EEF6F6)}\n.nrow{width:100%;display:flex;justify-content:center;position:relative}\n.node{position:relative;width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;padding:0;background:radial-gradient(circle at 50% 22%,#3F7898,#2B5C7A 70%);color:#fff;box-shadow:0 8px 0 var(--primary-edge),inset 0 3px 0 rgba(255,255,255,.3)}\n.node svg{width:36px;height:36px;stroke-width:3}\n.node.cur{background:radial-gradient(circle at 50% 22%,#F2BC62,#E3A33B 70%);color:var(--on-amber);box-shadow:0 8px 0 var(--amber-edge),inset 0 3px 0 rgba(255,255,255,.5)}\n.node.cur::before,.node.cur::after{z-index:0;content:\"\";position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(227,163,59,.55);pointer-events:none;animation:wave 2.4s ease-out infinite}\n.node.cur::after{animation-delay:1.2s}\n@keyframes wave{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.32);opacity:0}}\n@media (prefers-reduced-motion:reduce){.node.cur::before,.node.cur::after{animation:none;opacity:.5}}\n.node.lock{background:#DDE5EA;color:#7F909C;box-shadow:0 8px 0 #C6D1D8,inset 0 3px 0 rgba(255,255,255,.5);cursor:not-allowed}\n.go{position:absolute;top:-48px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px 14px;font-size:16px;line-height:24px;font-weight:600;color:var(--primary);box-shadow:0 3px 0 var(--line)}\n.go::after{content:\"\";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;background:var(--surface);border-bottom:2px solid var(--line);border-right:2px solid var(--line);transform:rotate(45deg)}\n.nl{position:absolute;top:100%;margin-top:14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;line-height:20px;color:var(--ink2)}\n/* list rows */\n.row{display:flex;align-items:cen 6px; border-radius: 14px; background: #2B5C7A\"><\u002Fdiv>اصلی<\u002Fdiv>\n        <div><div style=\"height: 56px; border-radius: 14px; background: #E3A33B\"><\u002Fdiv>دکمهٔ اصلی<\u002Fdiv>\n        <div><div style=\"height: 56px; border-radius: 14px; background: #7462E6\"><\u002Fdiv>شخصیت و مدال<\u002Fdiv>\n        <div><div style=\"height: 56px; border-radius: 14px; background: #A94438\"><\u002Fdiv>خطا<\u002Fdiv>\n        <div><div style=\"height: 56px; border-radius: 14px; background: #D5E5EF\"><\u002Fdiv>پس‌زمینهٔ ملایم<\u002Fdiv>\n        <div><div style=\"height: 56px; border-radius: 14px; background: #EEE3CF\"><\u002Fdiv>راهنمای نرم<\u002Fdiv>\n        <div><div style=\"height: 56px; border-radius: 14px; background: #F5F7F8; border: 2px solid #E4EAEE\"><\u002Fdiv>صفحه<\u002Fdiv>\n        <div><div style=\"height: 56px; border-radius: 14px; background: #1B2A36\"><\u002Fdiv>متن<\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"cap\" style=\"font-size: 16px; line-height: 24px\">کهربایی فقط برای کار اصلی صفحه (یک دکمه در هر صفحه). بنفش فقط برای شخصیت، مدال و برچسب تمرین.<\u002Fspan>\n      <span class=\"lab\" style=\"font-size: 20px; margin-top: 8px\">فاصله و گوشه<\u002Fspan>\n      <div style=\"display: flex; align-items: flex-end; gap: 12px\">\n        <div style=\"width: 4px; height: 4px; background: #2B5C7A\"><\u002Fdiv><div style=\"width: 8px; height: 8px; background: #2B5C7A\"><\u002Fdiv><div style=\"width: 12px; height: 12px; background: #2B5C7A\"><\u002Fdiv><div style=\"width: 16px; height: 16px; background: #2B5C7A\"><\u002Fdiv><div style=\"width: 24px; height: 24px; background: #2B5C7A\"><\u002Fdiv><div style=\"width: 32px; height: 32px; background: #2B5C7A\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"cap\" style=\"font-size: 16px; line-height: 24px\">فاصلهٔ ۴ · ۸ · ۱۲ · ۱۶ · ۲۴ · ۳۲. حاشیهٔ کناری همیشه ۲۴. گوشهٔ کارت و دکمه ۲۰.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; gap: 14px\">\n      <span class=\"lab\" style=\"font-size: 20px\">نوشته‌ها<\u002Fspan>\n      <div class=\"card\" style=\"display: flex; flex-direction: column; gap: 10px; box-shadow: none\">\n        <div style=\"font-size: 28px; line-height: 40px; font-weight: 600\">عنوان صفحه · ۲۸<\u002Fdiv>\n        <div style=\"font-size: 18px; line-height: 28px\">متن اصلی و راهنما · ۱۸<\u002Fdiv>\n        <div style=\"font-size: 16px; line-height: 24px; font-weight: 600\">برچسب و دکمهٔ کوچک · ۱۶<\u002Fdiv>\n        <div class=\"cap\">توضیح کوتاه · ۱۴ (کمترین اندازه)<\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"cap\" style=\"font-size: 16px; line-height: 24px\">وزیرمتن، دو وزن: معمولی و نیمه‌ضخیم. همهٔ عددها فارسی‌اند: ۰۱۲۳۴۵۶۷۸۹. متن‌ها کوتاه، پایهٔ اول حداکثر یک جمله.<\u002Fspan>\n      <span class=\"lab\" style=\"font-size: 20px; margin-top: 8px\">دکمه‌ها<\u002Fspan>\n      <button class=\"btn\" type=\"button\">اصلی<\u002Fbutton>\n      <button class=\"btn sec\" type=\"button\">فرعی<\u002Fbutton>\n      <button class=\"btn off\" type=\"button\" disabled=\"\">غیرفعال<\u002Fbutton>\n      <span class=\"cap\" style=\"font-size: 16px; line-height: 24px\">ارتفاع ۵۶، لبهٔ پایین ۴. برگشت و بستن همیشه بالا سمت راست.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; gap: 14px\">\n      <span class=\"lab\" style=\"font-size: 20px\">شخصیت‌ها: هر کدام یک جای ثابت<\u002Fspan>\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <div class=\"row\" style=\"padding: 8px 12px; box-shadow: none\"><div class=\"por main\" style=\"width: 64px; height: 64px\"><img src=\"6f4679e4-158b-45ce-b003-6e2de2cbc076\" alt=\"Main\"><\u002Fdiv><span class=\"rt\" style=\"font-size: 16px; line-height: 24px\">Main<small>میزبان: خوش‌آمد، ورود، جشن نتیجه<\u002Fsmall><\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"padding: 8px 12px; box-shadow: none\"><div class=\"por num\" style=\"width: 64px; height: 64px\"><img src=\"78707081-5a4c-444e-a4b6-4e35d1e8c19b\" alt=\"Number\"><\u002Fdiv><span class=\"rt\" style=\"font-size: 16px; line-height: 24px\">Number<small>معلم: شروع مرحله و درس<\u002Fsmall><\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"padding: 8px 12px; box-shadow: none\"><div class=\"por cover\" style=\"width: 64px; height: 64px\"><img src=\"2149c462-03c5-4b2a-b36c-c4a622880554\" alt=\"Dana\"><\u002Fdiv><span class=\"rt\" style=\"font-size: 16px; line-height: 24px\">Dana<small>راهنمای مسیر: کنار گرهٔ فعلی<\u002Fsmall><\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"padding: 8px 12px; box-shadow: none\"><div class=\"por cover\" style=\"width: 64px; height: 64px\"><img src=\"cd0bc62e-11a8-4e58-a940-69e00c5bf02f\" alt=\"Fandogh\"><\u002Fdiv><span class=\"rt\" style=\"font-size: 16px; line-height: 24px\">Fandogh<small>تمرین: صفحهٔ تمرین<\u002Fsmall><\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"padding: 8px 12px; box-shadow: none\"><div class=\"por rok\" style=\"width: 64px; height: 64px\"><img src=\"0adf826c-f546-4c3a-8191-825c65f34617\" alt=\"Roka\"><\u002Fdiv><span class=\"rt\" style=\"font-size: 16px; line-height: 24px\">Roka<small>چالش آخر مرحله<\u002Fsmall><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"cap\" style=\"font-size: 16px; line-height: 24px\">دو اندازه: بزرگ (۲۲۰ تا ۲۷۰ داخل دایرهٔ رنگی) فقط در صفحهٔ شروع و نتیجه؛ آواتار دایره‌ای ۸۸ کنار حبابِ حرف، همیشه سمت راست. داخل سؤال هیچ شخصیتی نیست.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:844}}\">\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
