name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Required checks: install from the lockfile, typecheck all workspaces, unit tests.
    # Node is pinned to .nvmrc (22.22.0) by setup-node — a local Node outside the pin is a
    # documented, loudly-warned deviation (see verify:repository), never a silent one.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:packages
      - run: npm run typecheck:all
      - run: npx vitest run

  static-core:
    # P1 (2026-11-12): REQUIRED gate. Every environment-independent static verifier runs here —
    # including the security-relevant ones (answer-key boundary, content-library byte-protection,
    # migration guards, Android foundation). No continue-on-error: a red static core is a red run.
    # Only the browser-gated verifiers (flows/parity/phase10, pinned list in verify-static-all.mjs)
    # are out of scope here; they run in visual-and-static below.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:packages
      - run: npm run verify:static:core

  visual-and-static:
    # Informational: the FULL suite (including the browser flows and pixel parity) plus Chromium.
    # The design goldens were rendered with one Chromium build; another build may differ by font
    # anti-aliasing, so this job stays informational until it has been confirmed green on GitHub.
    # A failure inside it is surfaced loudly below — it is never a release approval.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:packages
      - id: verify
        run: npm run verify:static:all
      - name: surface hidden failures (wave E1)
        # The job stays informational (continue-on-error above) until the owner confirms it green on
        # GitHub, but a failure inside it must be loud in the pipeline output, never silent.
        if: always()
        run: |
          if [ "${{ steps.verify.outcome }}" != "success" ]; then
            echo "::warning::verify:static:all FAILED inside the informational job — static verifiers, pixel parity or browser flows are RED. The release gate is NOT green; read this job's log before any release decision."
            exit 0
          fi
          echo "verify:static:all passed in the informational job."
