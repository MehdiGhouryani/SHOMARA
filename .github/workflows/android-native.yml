name: Android Native

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"
      - ".nvmrc"
      - "package.json"
      - "scripts/android-build.mjs"
      - "tools/tests/android-build.test.mjs"
      - "scripts/verify-android-build-harness.mjs"
      - "scripts/verify-android-environment.mjs"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"
      - ".nvmrc"
      - "package.json"
      - "scripts/android-build.mjs"
      - "tools/tests/android-build.test.mjs"
      - "scripts/verify-android-build-harness.mjs"
      - "scripts/verify-android-environment.mjs"

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK 37
        shell: bash
        # Upstream publishes API 37 as android-37.0/37.1/37.2 — the bare `platforms;android-37`
        # package no longer exists in the SDK index (root cause of the 2026-10..11 CI failures).
        # compileSdk stays the integer 37; the preflight accepts android-37 and android-37.<minor> dirs.
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --channel=0 "platforms;android-37.0"
      - name: Verify build harness contract
        run: npm run verify:android-build-harness
      - name: Test build failure and environment handling
        run: node --test tools/tests/android-build.test.mjs
      - name: Unit, lint and compile gate
        run: npm run android:gate
      - name: Upload diagnostics (reports only — never packages)
        # Diagnostic evidence only: lint/unit reports and the machine-readable gate.json.
        # No APK/AAB, no signing output (enforced by verify-android-foundation).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gate-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build-reports/android/*.json
            apps/android/**/build/reports/**/*.html
            apps/android/**/build/reports/**/*.xml
