name: Android Native

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"
      - ".nvmrc"
      - "package.json"
      - "scripts/android-build.mjs"
      - "tools/tests/android-build.test.mjs"
      - "scripts/verify-android-build-harness.mjs"
      - "scripts/verify-android-environment.mjs"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-native.yml"
      - ".nvmrc"
      - "package.json"
      - "scripts/android-build.mjs"
      - "tools/tests/android-build.test.mjs"
      - "scripts/verify-android-build-harness.mjs"
      - "scripts/verify-android-environment.mjs"

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # The pinned compile platform: exact upstream Package ID (verified live with
      # `sdkmanager --list --channel=0` on 2026-11-12 — bare platforms;android-37 no longer
      # exists in the stable index). compileSdk stays the integer 37.
      PINNED_SDK_PACKAGE: "platforms;android-37.0"
      PINNED_SDK_PLATFORM_DIR: "/usr/local/lib/android/sdk/platforms/android-37.0"
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # P1 hardening: explicit, invalidatable caches. Keys cover OS, toolchain pins and the
      # lockfile/dependency manifests; restore keys let a toolchain bump reuse the bulk of the
      # cache while the exact key keeps determinism.
      - name: Cache Android platform package
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/platforms/android-37.0
          key: android-sdk-${{ runner.os }}-platform-android-37.0-v1
      - name: Install compile SDK 37 (pinned package)
        shell: bash
        # Idempotent: a cache hit restores the platform dir; sdkmanager verifies it against the
        # live index and either confirms, upgrades a stale revision, or installs from scratch.
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "$PINNED_SDK_PACKAGE"
      - name: Cache Gradle (caches + wrapper distributions)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk17-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml', 'apps/android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk17-
      - name: Verify build harness contract
        run: npm run verify:android-build-harness
      - name: Test build failure and environment handling
        run: node --test tools/tests/android-build.test.mjs
      - name: Unit, lint and compile gate
        run: npm run android:gate
      - name: Upload diagnostics (reports only — never packages)
        # Diagnostic evidence only: lint/unit reports, raw test-result XML and the
        # machine-readable gate.json. No APK/AAB, no signing output (enforced by
        # verify-android-foundation).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gate-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build-reports/android/*.json
            apps/android/**/build/reports/**/*.html
            apps/android/**/build/reports/**/*.xml
            apps/android/**/build/test-results/**/*.xml
